# dsh-rp-studio bundle layer.
#
# The host row below is not decoration: the web client's module registry scans
# *live Loader entries* and reads `dsh.client` from the package each entry
# resolves to. A bundle that inserts no entry leaves the package with no
# fiber, so its client bundle is never scanned, never served at
# /plugins/dsh-rp-studio/client.js, and the view it registers never shows up
# in the conversation tab strip. This row is what makes the client half exist.
#
# 角色人格不再做成「预设 / 模式」：`lib/index.js` 在部署层注册了提示词段
# `rp-studio:persona`，所以任何预设、任何会话都自动带上当前绑定的角色卡。
- insert:
    - id: rp-studio
      name: 'dsh-rp-studio'

    # 兼容条目：id 仍是 `roleplay`。
    # 旧会话记录里存的是 preset id（dsh-roleplay 留下的 `roleplay`），那个 bundle
    # 已不在 bundles 列表里时，这些会话会报
    # `agent-preset/not-found: Unknown agent preset: roleplay`。这里保留同 id 的预设，
    # 让旧会话照常打开；对话人格由 lib/index.js 在部署层注册的 `rp-studio:persona` 段统一提供，
    # 所以它同时也是「角色后台」实际在用的那一套全工具配置。
    - id: preset-roleplay-compat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: roleplay
        name: 角色后台 · 角色扮演
        description: 全工具角色扮演。角色卡、世界书、图库与权限都在顶栏「角色后台」页签里改；人格由部署层提示段统一注入，任何会话自动生效。
        order: 23
        plugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-workspace-dependencies
            name: '@deepseek-ai/dsh-tool-workspace-dependencies'
            config:
              source: !!js "process.getBuiltinModule('node:path').resolve(process.getBuiltinModule('node:path').dirname(process.execPath), 'resources/runtime/primary-runtime')"
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
